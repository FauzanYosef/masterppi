# Docker lokal: website di http://localhost:3002, API fisip-api-dev di http://localhost:3001.
#   docker compose up -d --build
# (Memakai jaringan "fisip-net" bersama fisip-api-dev agar website dapat memanggil API dari server.)
services:
  web:
    container_name: mppi-web
    build:
      context: .
      args:
        # URL yang diakses BROWSER pengunjung.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN:-magisterppi.uinsgd.ac.id}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        # API di localhost host tidak terjangkau dari container; gambar dimuat langsung oleh browser.
        NEXT_IMAGE_UNOPTIMIZED: "true"
    environment:
      # URL yang diakses SERVER Next.js (metadata, sitemap) di dalam Docker.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://fisip-api-dev:3001}
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - fisip-net

networks:
  fisip-net:
    external: true
